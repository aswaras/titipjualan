<style>
:root {
  --indigo: #6366f1; --indigo-dark: #4f46e5; --indigo-deep: #3730a3;
  --indigo-light: #eef2ff; --indigo-mid: #c7d2fe;
  --violet: #7c3aed; --violet-light: #f5f3ff;
  --emerald: #059669; --emerald-light: #ecfdf5; --emerald-mid: #a7f3d0;
  --rose: #e11d48; --rose-light: #fff1f2; --rose-mid: #fecdd3;
  --amber: #d97706; --amber-light: #fffbeb; --amber-mid: #fde68a;
  --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-150: #eaeff5;
  --slate-200: #e2e8f0; --slate-300: #cbd5e1;
  --slate-400: #94a3b8; --slate-500: #64748b; --slate-600: #475569;
  --slate-700: #334155; --slate-800: #1e293b; --slate-900: #0f172a;
  --bg: #f5f3ff; --white: #ffffff;
  --r-xs: 8px; --r-sm: 10px; --r: 14px; --r-lg: 18px; --r-xl: 22px; --r-2xl: 28px;
  --sh-xs: 0 1px 2px rgba(0,0,0,.05);
  --sh-sm: 0 2px 8px rgba(0,0,0,.07);
  --sh: 0 4px 16px rgba(0,0,0,.09);
  --sh-lg: 0 8px 28px rgba(0,0,0,.13);
  --sh-indigo: 0 6px 20px rgba(99,102,241,.28);
  --nav-h: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;height:100%;overflow:hidden}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);color:var(--slate-800);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
  height:100%;overflow:hidden;
  /* Fullscreen di standalone PWA */
  position:fixed;width:100%;
}
#root{
  height:100dvh;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}
button{cursor:pointer;border:none;font-family:inherit;outline:none}
input,select,textarea{font-family:inherit;outline:none}
img{display:block}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--slate-200);border-radius:4px}

/* ── Animations ─────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes popIn{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
@keyframes dot-bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
@keyframes pwaSlide{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}

.fade-up{animation:fadeUp .3s ease forwards}
.fade-in{animation:fadeIn .25s ease forwards}
.pop-in{animation:popIn .22s cubic-bezier(.34,1.56,.64,1) forwards}
.spin{animation:spin .7s linear infinite}
.pulse-dot{animation:pulse 2s ease-in-out infinite}

.skeleton{
  background:linear-gradient(90deg,var(--slate-100) 25%,var(--slate-50) 50%,var(--slate-100) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;
  border-radius:var(--r-sm);
}

/* ══════════════════════════════════════════════════
   AUTH PAGE
══════════════════════════════════════════════════ */
.auth-wrap{
  min-height:100dvh;
  background:linear-gradient(145deg,#312e81 0%,#4f46e5 40%,#7c3aed 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1.25rem;position:relative;overflow:hidden;
}
.auth-orb{
  position:absolute;border-radius:50%;pointer-events:none;
  filter:blur(55px);opacity:.55;
}
.auth-orb-1{width:320px;height:320px;background:#818cf8;top:-120px;right:-100px}
.auth-orb-2{width:280px;height:280px;background:#a78bfa;bottom:-100px;left:-80px}
.auth-orb-3{width:180px;height:180px;background:#c4b5fd;top:40%;left:50%;transform:translate(-50%,-50%);opacity:.2}

.auth-card{
  background:var(--white);border-radius:var(--r-2xl);
  padding:2rem 1.75rem 1.75rem;width:100%;max-width:390px;
  box-shadow:0 40px 90px rgba(0,0,0,.35);
  position:relative;z-index:1;
  animation:slideUp .45s cubic-bezier(.34,1.1,.64,1);
}
.auth-brand{
  display:flex;align-items:center;gap:11px;
  margin-bottom:1.6rem;justify-content:center;
}
.auth-icon{
  width:48px;height:48px;border-radius:15px;
  background:linear-gradient(135deg,var(--indigo),var(--violet));
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:var(--sh-indigo);
}
.auth-brand h1{
  font-size:1.7rem;font-weight:800;
  background:linear-gradient(135deg,var(--indigo-dark),var(--violet));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:-.03em;
}
.auth-sub{text-align:center;margin-bottom:1.5rem}
.auth-sub h2{font-size:1.05rem;font-weight:700;color:var(--slate-800)}
.auth-sub p{color:var(--slate-400);font-size:.8rem;margin-top:.25rem}

.seg{
  display:flex;background:var(--slate-100);
  border-radius:var(--r-sm);padding:3px;gap:3px;margin-bottom:1.5rem;
}
.seg-btn{
  flex:1;padding:.58rem;border-radius:8px;
  font-weight:700;font-size:.82rem;
  color:var(--slate-400);background:transparent;transition:all .18s;
}
.seg-btn.on{background:var(--white);color:var(--indigo);box-shadow:var(--sh-sm)}

.fgrp{margin-bottom:.9rem}
.fgrp label,.flabel{
  display:block;font-size:.72rem;font-weight:700;
  color:var(--slate-500);margin-bottom:.38rem;letter-spacing:.02em;text-transform:uppercase;
}
.finput,.inp{
  width:100%;padding:.72rem .95rem;
  border:1.5px solid var(--slate-200);border-radius:var(--r-sm);
  font-size:.875rem;color:var(--slate-800);background:var(--white);
  transition:border-color .15s,box-shadow .15s;
}
.finput:focus,.inp:focus{
  border-color:var(--indigo);
  box-shadow:0 0 0 3px rgba(99,102,241,.12);
}
select.inp{cursor:pointer}

.err-box{
  background:var(--rose-light);border:1.5px solid var(--rose-mid);
  color:var(--rose);border-radius:var(--r-sm);
  padding:.65rem .9rem;font-size:.8rem;
  margin-bottom:.9rem;display:flex;align-items:center;gap:7px;
}

.btn-auth{
  width:100%;padding:.88rem;
  background:linear-gradient(135deg,var(--indigo),var(--violet));
  color:var(--white);border-radius:var(--r-sm);
  font-weight:700;font-size:.92rem;
  transition:all .18s;margin-top:.3rem;
  box-shadow:var(--sh-indigo);letter-spacing:.01em;
}
.btn-auth:active{transform:scale(.98);box-shadow:none}
.btn-auth:disabled{opacity:.6;cursor:not-allowed;transform:none}

/* ══════════════════════════════════════════════════
   PWA INSTALL BANNER — redesigned
══════════════════════════════════════════════════ */
.pwa-banner{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  background:linear-gradient(135deg,#312e81,#4f46e5 50%,#7c3aed);
  padding:1.1rem 1.25rem calc(1.1rem + var(--safe-bottom));
  animation:pwaSlide .4s cubic-bezier(.34,1.1,.64,1);
  border-radius:22px 22px 0 0;
}
.pwa-inner{display:flex;align-items:center;gap:13px}
.pwa-app-icon{
  width:50px;height:50px;border-radius:14px;flex-shrink:0;
  background:rgba(255,255,255,.15);backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;font-size:24px;
}
.pwa-info{flex:1;min-width:0}
.pwa-info strong{
  display:block;font-size:.9rem;font-weight:800;
  color:#fff;letter-spacing:-.01em;
}
.pwa-info span{font-size:.72rem;color:rgba(255,255,255,.65);margin-top:.1rem;display:block}
.pwa-actions{display:flex;gap:8px;flex-shrink:0}
.pwa-install{
  background:var(--white);color:var(--indigo);
  border-radius:var(--r-xs);padding:.5rem 1rem;
  font-size:.8rem;font-weight:800;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
  white-space:nowrap;
}
.pwa-dismiss{
  width:34px;height:34px;border-radius:var(--r-xs);
  background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.8);flex-shrink:0;
}
.pwa-dismiss svg{width:14px;height:14px}

/* ══════════════════════════════════════════════════
   APP SHELL — mobile-first, no sidebar
══════════════════════════════════════════════════ */
.shell{display:flex;flex-direction:column;min-height:100dvh;height:100%;background:var(--bg)}

/* Main content area */
.main{
  flex:1;
  padding:.9rem .9rem 5.5rem;
  min-height:auto;overflow-y:auto;
}

.pg-head{margin-bottom:1.1rem}
.pg-head h2{
  font-size:1.25rem;font-weight:800;color:var(--slate-900);
  letter-spacing:-.03em;line-height:1.2;
}
.pg-head p{color:var(--slate-400);font-size:.82rem;margin-top:.2rem}

/* ── Top header (always visible) ─────────────────── */
.mob-header{
  display:flex;
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--slate-150);
  padding:.7rem 1rem;padding-top:calc(.7rem + var(--safe-top));
  align-items:center;justify-content:space-between;
}
.mob-brand{
  display:flex;align-items:center;gap:9px;
  font-size:1.08rem;font-weight:800;letter-spacing:-.025em;
  background:linear-gradient(135deg,var(--indigo-dark),var(--violet));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.mob-brand-icon{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--indigo),var(--violet));
  display:flex;align-items:center;justify-content:center;font-size:15px;
  box-shadow:var(--sh-indigo);
}
.mob-right{display:flex;align-items:center;gap:8px}
.mob-sync{
  display:flex;align-items:center;gap:4px;
  padding:.28rem .58rem;border-radius:999px;
  background:var(--emerald-light);
  border:1px solid var(--emerald-mid);
}
.mob-sync-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;flex-shrink:0}
.mob-sync span{font-size:.64rem;font-weight:700;color:var(--emerald)}
/* avatar tap target */
.mob-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--indigo),var(--violet));
  display:flex;align-items:center;justify-content:center;
  color:var(--white);font-weight:800;font-size:.78rem;
  box-shadow:var(--sh-indigo);cursor:pointer;
  border:2px solid var(--white);
}

/* ── Profile Drawer ────────────────────────────── */
.drawer-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(15,23,42,.45);
  backdrop-filter:blur(4px);
  animation:fadeIn .2s ease;
}
.profile-drawer{
  position:fixed;top:0;right:0;bottom:0;z-index:201;
  width:min(280px, 85vw);
  background:var(--white);
  box-shadow:-8px 0 40px rgba(0,0,0,.15);
  display:flex;flex-direction:column;
  animation:drawerIn .28s cubic-bezier(.34,1.1,.64,1);
}
@keyframes drawerIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.drawer-head{
  padding:1.5rem 1.25rem 1rem;
  background:linear-gradient(135deg,#312e81,#4f46e5,#7c3aed);
  padding-top:calc(1.5rem + var(--safe-top));
}
.drawer-avatar{
  width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.2);border:2.5px solid rgba(255,255,255,.4);
  display:flex;align-items:center;justify-content:center;
  color:var(--white);font-weight:800;font-size:1.2rem;
  margin-bottom:.75rem;
}
.drawer-name{font-size:1rem;font-weight:800;color:#fff;letter-spacing:-.01em}
.drawer-email{font-size:.72rem;color:rgba(255,255,255,.6);margin-top:.2rem}
.drawer-body{flex:1;padding:1rem}
.drawer-info-row{
  display:flex;align-items:center;gap:10px;
  padding:.7rem .9rem;border-radius:var(--r-sm);
  background:var(--indigo-light);border:1px solid var(--indigo-mid);
  margin-bottom:.75rem;
}
.drawer-info-row span{font-size:.78rem;color:var(--indigo);font-weight:600}
.drawer-footer{padding:1rem 1rem calc(1rem + var(--safe-bottom));border-top:1px solid var(--slate-150)}
.drawer-logout{
  width:100%;padding:.75rem;border-radius:var(--r-sm);
  background:var(--rose-light);color:var(--rose);
  font-size:.85rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s;
}
.drawer-logout:hover{background:var(--rose-mid)}

/* ── Bottom nav ────────────────────────────────── */
.bot-nav{
  display:block;
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--slate-150);
  padding:.3rem 0 calc(.3rem + var(--safe-bottom));
  box-shadow:0 -4px 20px rgba(0,0,0,.07);
}
.bot-nav ul{display:flex;justify-content:space-around;list-style:none;align-items:center}
.bot-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:.38rem .5rem;border-radius:var(--r-sm);
  font-size:.58rem;font-weight:600;color:var(--slate-400);
  background:transparent;transition:all .15s;min-width:52px;
  position:relative;
}
.bot-item svg{width:22px;height:22px;transition:transform .2s}
.bot-item.on{color:var(--indigo)}
.bot-item.on svg{transform:scale(1.1)}
.bot-item.on::before{
  content:'';
  position:absolute;top:4px;left:50%;transform:translateX(-50%);
  width:30px;height:26px;border-radius:var(--r-xs);
  background:var(--indigo-light);z-index:-1;
}
.bot-logout{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:.38rem .5rem;border-radius:var(--r-sm);
  font-size:.56rem;font-weight:600;color:var(--slate-300);
  background:transparent;transition:all .15s;min-width:50px;
}
.bot-logout svg{width:19px;height:19px}
.bot-logout:active{color:var(--rose);background:var(--rose-light)}

.hero-card{border-radius:var(--r-lg)}
.stat-row{gap:.5rem}
.stat-c{padding:.8rem .55rem}
.stat-val{font-size:1.2rem}
.stat-emoji{font-size:1.25rem;margin-bottom:.3rem}

/* ══════════════════════════════════════════════════
   CARDS & COMPONENTS
══════════════════════════════════════════════════ */
.card{
  background:var(--white);border-radius:var(--r-lg);
  border:1px solid var(--slate-150);padding:1.15rem;
  box-shadow:var(--sh-xs);
}
.card-title{
  font-size:.88rem;font-weight:700;color:var(--slate-800);
  margin-bottom:.95rem;display:flex;align-items:center;gap:9px;
}
.card+.card{margin-top:.85rem}

/* Hero gradient card */
.hero-card{
  background:linear-gradient(140deg,#312e81 0%,#4338ca 45%,#6d28d9 100%);
  border-radius:var(--r-xl);padding:1.4rem 1.3rem;color:var(--white);
  margin-bottom:1rem;position:relative;overflow:hidden;
  box-shadow:0 10px 30px rgba(79,70,229,.35);
}
.hero-card::before{
  content:'';position:absolute;top:-60px;right:-60px;
  width:200px;height:200px;border-radius:50%;
  background:rgba(255,255,255,.06);
}
.hero-card::after{
  content:'';position:absolute;bottom:-40px;left:20px;
  width:130px;height:130px;border-radius:50%;
  background:rgba(255,255,255,.04);
}
.hero-label{
  font-size:.66rem;font-weight:700;opacity:.65;
  text-transform:uppercase;letter-spacing:.1em;
}
.hero-title{font-size:.95rem;font-weight:700;margin-top:.15rem;opacity:.88}
.hero-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:.8rem;margin-top:1.1rem;position:relative;z-index:1;
}
.hero-stat{
  background:rgba(255,255,255,.13);border-radius:var(--r-sm);
  padding:1rem;backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);
}
.hero-stat-l{font-size:.62rem;font-weight:700;opacity:.65;text-transform:uppercase;letter-spacing:.07em}
.hero-stat-v{font-size:1.25rem;font-weight:800;margin-top:.25rem;letter-spacing:-.02em;line-height:1}

/* Stat row */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:1rem}
.stat-c{
  background:var(--white);border-radius:var(--r-lg);
  border:1px solid var(--slate-150);padding:1rem .85rem;
  box-shadow:var(--sh-xs);text-align:center;
}
.stat-emoji{font-size:1.5rem;margin-bottom:.4rem;line-height:1}
.stat-val{
  font-size:1.4rem;font-weight:800;
  color:var(--slate-900);letter-spacing:-.03em;
  display:flex;align-items:center;justify-content:center;
  min-height:1.8rem;
}
.stat-lbl{font-size:.67rem;color:var(--slate-400);font-weight:600;margin-top:.15rem;letter-spacing:.01em}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:.5rem .95rem;border-radius:var(--r-sm);
  font-weight:600;font-size:.8rem;transition:all .15s;
  letter-spacing:.01em;
}
.btn svg{width:13px;height:13px;flex-shrink:0}
.btn:active{transform:scale(.97)}
.btn-blue{background:var(--indigo);color:var(--white);box-shadow:var(--sh-indigo)}
.btn-blue:hover{background:var(--indigo-dark)}
.btn-green{background:var(--emerald);color:var(--white);box-shadow:0 3px 10px rgba(5,150,105,.22)}
.btn-green:hover{background:#047857}
.btn-red{background:var(--rose-light);color:var(--rose)}

// ── PWA BANNER ──────────────────────────────────────────────────
function PwaBanner(){
  const [prompt, setPrompt] = React.useState(null);
  const [show, setShow] = React.useState(false);

  React.useEffect(()=>{
    const dismissed = sessionStorage.getItem('pwa_dismissed');
    if(dismissed) return;
    const handler = e => { e.preventDefault(); setPrompt(e); setShow(true); };
    window.addEventListener('beforeinstallprompt', handler);
    return ()=>window.removeEventListener('beforeinstallprompt', handler);
  },[]);

  const install = async()=>{
    if(!prompt) return;
    await prompt.prompt();
    const r = await prompt.userChoice;
    if(r.outcome==='accepted') setShow(false);
  };
  const dismiss = ()=>{ setShow(false); sessionStorage.setItem('pwa_dismissed','1'); };

  if(!show) return null;
  return (
    <div className="pwa-banner pop-in">
      <div className="pwa-inner">
        <div className="pwa-app-icon">📦</div>
        <div className="pwa-info">
          <strong>Pasang TitipKu di HP kamu</strong>
          <span>Akses cepat langsung dari layar utama</span>
        </div>
        <div className="pwa-actions">
          <button className="pwa-install" onClick={install}>
            <IC.Download/> Pasang
          </button>
          <button className="pwa-dismiss" onClick={dismiss}><IC.X/></button>
        </div>
      </div>
    </div>
  );
}

function AuthPage({onLogin}){
  const [tab,setTab] = React.useState('login');
  const [form,setForm] = React.useState({email:'',password:'',nama:''});
  const [loading,setLoading] = React.useState(false);
  const [err,setErr] = React.useState('');

  const go = async()=>{
    setErr(''); setLoading(true);
    try{
      const res = await api({action: tab==='login'?'login':'register', ...form});
      if(res.success){
        localStorage.setItem('tk_token', res.token);
        localStorage.setItem('tk_user', JSON.stringify(res.user));
        onLogin(res.user);
      } else setErr(res.error||'Terjadi kesalahan.');
    } catch{ setErr('Tidak dapat terhubung. Cek koneksi internet.'); }
    setLoading(false);
  };

  return (
    <div className="auth-wrap">
      <div className="auth-orb auth-orb-1"/>
      <div className="auth-orb auth-orb-2"/>
      <div className="auth-orb auth-orb-3"/>
      <div className="auth-card">
        <div className="auth-brand">
          <div className="auth-icon">📦</div>
          <h1>TitipKu</h1>
        </div>
        <div className="auth-sub">
          <h2>{tab==='login'?'Selamat Datang 👋':'Buat Akun Baru ✨'}</h2>
          <p>{tab==='login'?'Masuk untuk kelola titipan Anda':'Daftar gratis, mulai sekarang'}</p>
        </div>

        <div className="seg">
          <button className={`seg-btn ${tab==='login'?'on':''}`} onClick={()=>{setTab('login');setErr('')}}>Masuk</button>
          <button className={`seg-btn ${tab==='register'?'on':''}`} onClick={()=>{setTab('register');setErr('')}}>Daftar</button>
        </div>

        {err&&<div className="err-box"><IC.Alert/>{err}</div>}

        {tab==='register'&&(
          <div className="fgrp">
            <label>Nama Toko / Nama Anda</label>
            <input className="finput" placeholder="Cth: Warung Bu Sari" value={form.nama} onChange={e=>setForm({...form,nama:e.target.value})}/>
          </div>
        )}
        <div className="fgrp">
          <label>Email</label>
          <input className="finput" type="email" placeholder="email@contoh.com" value={form.email} onChange={e=>setForm({...form,email:e.target.value})}/>
        </div>
        <div className="fgrp">
          <label>Password</label>
          <input className="finput" type="password" placeholder={tab==='register'?'Minimal 6 karakter':'••••••••'} value={form.password}
            onChange={e=>setForm({...form,password:e.target.value})} onKeyDown={e=>e.key==='Enter'&&go()}/>
        </div>
        <button className="btn-auth" onClick={go} disabled={loading}>
          {loading
            ? <span style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
                <MiniSpin color="white"/> Memproses…
              </span>
            : (tab==='login'?'🚀 Masuk':'✨ Buat Akun')}
        </button>
      </div>
      <PwaBanner/>
    </div>
  );
}

// ══════════════════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════════════════
function App(){
  const [user,setUser] = React.useState(()=>{ try{ return JSON.parse(localStorage.getItem('tk_user')); }catch{return null;} });
  const [tab,setTab] = React.useState('beranda');
  const [penitip,setPenitip] = React.useState([]);
  const [barang,setBarang] = React.useState([]);
  const [penjualan,setPenjualan] = React.useState([]);
  const [loading,setLoading] = React.useState(false);
  const [toast,setToast] = React.useState(null);

  const [drawerOpen, setDrawerOpen] = React.useState(false);

  const notif = (msg,type='ok')=>{ setToast({msg,type}); setTimeout(()=>setToast(null),3200); };
  const logout = ()=>{ localStorage.removeItem('tk_token'); localStorage.removeItem('tk_user'); setUser(null); };

  React.useEffect(()=>{ if(user) fetchAll(); },[user]);

  const fetchAll = async()=>{
    setLoading(true);
    try{
      const [rP,rB,rJ] = await Promise.all([
        api({action:'getPenitip'}), api({action:'getBarang'}), api({action:'getPenjualan'})
      ]);
      if(rP.success) setPenitip(rP.data);
      if(rB.success) setBarang(rB.data);
      if(rJ.success) setPenjualan(rJ.data);
    } catch{ notif('Gagal memuat data','err'); }
    setLoading(false);
  };

  if(!user) return <AuthPage onLogin={u=>setUser(u)}/>;

  const navs = [
    {id:'beranda',label:'Beranda',I:IC.Home},
    {id:'penitip',label:'Penitip',I:IC.Users},
    {id:'barang', label:'Barang', I:IC.Package},
    {id:'kasir',  label:'Kasir',  I:IC.Cart},
    {id:'setoran',label:'Setoran',I:IC.Wallet},
  ];

  return (
    <div className="shell">
      {toast&&(
        <div className={`toast ${toast.type==='err'?'toast-err':'toast-ok'}`}>
          {toast.type==='err'?<IC.Alert/>:<IC.Check/>}{toast.msg}
        </div>
      )}

      {/* PROFILE DRAWER */}
      {drawerOpen&&(
        <>
          <div className="drawer-overlay" onClick={()=>setDrawerOpen(false)}/>
          <div className="profile-drawer">
            <div className="drawer-head">
              <div className="drawer-avatar">{user.nama?.[0]?.toUpperCase()||'U'}</div>
              <div className="drawer-name">{user.nama}</div>
              <div className="drawer-email">{user.email}</div>
            </div>
            <div className="drawer-body">
              <div className="drawer-info-row">
                <div style={{width:8,height:8,borderRadius:'50%',background:'#22c55e',flexShrink:0,animation:'pulse 2s ease-in-out infinite'}}/>
                <span>Terhubung ke Spreadsheet</span>
              </div>
            </div>
            <div className="drawer-footer">
              <button className="drawer-logout" onClick={()=>{setDrawerOpen(false);logout();}}>
                <IC.Logout style={{width:16,height:16}}/>Keluar dari Akun
              </button>
            </div>
          </div>
        </>
      )}

      {/* MOBILE HEADER */}
      <div className="mob-header">
        <div className="mob-brand">
          <div className="mob-brand-icon">📦</div>TitipKu
        </div>
        <div className="mob-right">
          {loading
            ? <div className="loading-row" style={{background:'var(--indigo-light)',borderRadius:'999px',padding:'.28rem .65rem',border:'1px solid var(--indigo-mid)'}}>
                <MiniSpin/><span style={{fontSize:'.65rem',color:'var(--indigo)',fontWeight:600}}>Memuat</span>
              </div>
            : <div className="mob-sync">
                <div className="mob-sync-dot pulse-dot"/>
                <span>Live</span>
              </div>
          }
          <div className="mob-avatar" onClick={()=>setDrawerOpen(true)}>
            {user.nama?.[0]?.toUpperCase()||'U'}
          </div>
        </div>
      </div>

      {/* MAIN */}
      <main className="main">
        {tab==='beranda' && <PgBeranda penitip={penitip} barang={barang} penjualan={penjualan} user={user} loading={loading}/>}
        {tab==='penitip' && <PgPenitip penitip={penitip} barang={barang} setPenitip={setPenitip} notif={notif} loading={loading}/>}
        {tab==='barang'  && <PgBarang  penitip={penitip} barang={barang} setBarang={setBarang} notif={notif} loading={loading}/>}
        {tab==='kasir'   && <PgKasir   barang={barang} penjualan={penjualan} setBarang={setBarang} setPenjualan={setPenjualan} notif={notif}/>}
        {tab==='setoran' && <PgSetoran penitip={penitip} barang={barang} penjualan={penjualan} loading={loading}/>}
      </main>

      {/* BOTTOM NAV */}
      <nav className="bot-nav">
        <ul>
          {navs.map(({id,label,I})=>(
            <li key={id}>
              <button className={`bot-item ${tab===id?'on':''}`} onClick={()=>setTab(id)}>
                <I/>{label}
              </button>
            </li>
          ))}
        </ul>
      </nav>
      <PwaBanner/>
    </div>
  );
}

// ══════════════════════════════════════════════════
// BERANDA
// ══════════════════════════════════════════════════
function PgBeranda({penitip,barang,penjualan,user,loading}){
  const omzet = penjualan.reduce((t,p)=>{ const b=barang.find(x=>x.id===p.idBarang); return t+(b?b.hargaJual*p.qty:0); },0);
  const untung = penjualan.reduce((t,p)=>{ const b=barang.find(x=>x.id===p.idBarang); return t+(b?(b.hargaJual-b.hargaSetor)*p.qty:0); },0);

  return (
    <div className="fade-up">
      <div className="pg-head">
        <h2>Halo, {user.nama.split(' ')[0]} 👋</h2>
        <p>Ringkasan bisnis titip jualan Anda</p>
      </div>

      <div className="hero-card">
        <div className="hero-label">Performa Bisnis</div>
        <!-- <div className="hero-title">Data real-time</div> -->
        <div className="hero-grid">
          <div className="hero-stat">
            <div className="hero-stat-l">Keuntungan</div>
            <div className="hero-stat-v">
              {loading
                ? <span style={{display:'flex',alignItems:'center',gap:6,opacity:.7,fontSize:'.85rem'}}>
                    <MiniSpin color="white"/>Memuat…
                  </span>
                : formatRp(untung)}
            </div>
          </div>
          <div className="hero-stat">
            <div className="hero-stat-l">Omzet</div>
            <div className="hero-stat-v">
              {loading
                ? <span style={{display:'flex',alignItems:'center',gap:6,opacity:.7,fontSize:'.85rem'}}>
                    <MiniSpin color="white"/>Memuat…
                  </span>
                : formatRp(omzet)}
            </div>
          </div>
        </div>
      </div>

      <div className="stat-row">
        <div className="stat-c">
          <div className="stat-emoji">👥</div>
          <div className="stat-val">{loading?<MiniSpin/>:penitip.length}</div>
          <div className="stat-lbl">Penitip</div>
        </div>
        <div className="stat-c">
          <div className="stat-emoji">📦</div>
          <div className="stat-val">{loading?<MiniSpin/>:barang.length}</div>
          <div className="stat-lbl">Barang</div>
        </div>
        <div className="stat-c">
          <div className="stat-emoji">🛒</div>
          <div className="stat-val">{loading?<MiniSpin/>:penjualan.length}</div>
          <div className="stat-lbl">Transaksi</div>
        </div>
      </div>

      <div className="card">
        <div className="card-title" style={{justifyContent:'space-between'}}>
          <span>Penjualan Terakhir</span>
          {loading&&<div className="loading-row"><MiniSpin/><span>Memuat…</span></div>}
        </div>
        {loading&&penjualan.length===0 ? <SkeletonList/> :
          penjualan.length===0 ? (
            <div className="empty"><div className="empty-icon">🛒</div><p>Belum ada penjualan</p><span>Catat di menu Kasir</span></div>
          ) : penjualan.slice(0,5).map(p=>{
            const b = barang.find(x=>x.id===p.idBarang);
            return (
              <div key={p.id} className="list-row">
                <div>
                  <div style={{fontWeight:600,fontSize:'.875rem'}}>{b?b.nama:'Barang dihapus'}</div>
                  <div style={{fontSize:'.72rem',color:'var(--slate-400)',marginTop:2}}>
                    {new Date(p.tanggal).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · {p.qty} item
                  </div>
                </div>
                <div style={{fontWeight:800,color:'var(--emerald)',fontSize:'.9rem'}}>{formatRp((b?.hargaJual||0)*p.qty)}</div>
              </div>
            );
          })
        }
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════
// PENITIP
// ══════════════════════════════════════════════════
function PgPenitip({penitip,barang,setPenitip,notif,loading}){
  const [form,setForm] = React.useState({nama:'',kontak:''});
  const [saving,setSaving] = React.useState(false);
  const [modalOpen,setModalOpen] = React.useState(false);
  const [search,setSearch] = React.useState('');

  const openModal = ()=>{ setForm({nama:'',kontak:''}); setModalOpen(true); };
  const closeModal = ()=>setModalOpen(false);

  const tambah = async()=>{
    if(!form.nama.trim()) return notif('Nama penitip wajib diisi','err');
    setSaving(true);
    try{
      const r = await api({action:'addPenitip',nama:form.nama.trim(),kontak:form.kontak.trim()});
      if(r.success){ setPenitip(p=>[...p,r.data]); closeModal(); notif('Penitip ditambahkan!'); }
      else notif(r.error,'err');
    } catch{ notif('Gagal terhubung','err'); }
    setSaving(false);
  };

  const hapus = async id=>{
    if(barang.some(b=>b.idPenitip===id)) return notif('Penitip masih punya barang!','err');
    if(!confirm('Hapus penitip ini?')) return;
    try{
      const r = await api({action:'deletePenitip',id});
      if(r.success){ setPenitip(p=>p.filter(x=>x.id!==id)); notif('Penitip dihapus'); }
      else notif(r.error,'err');
    } catch{ notif('Gagal terhubung','err'); }
  };

  const exportExcel = ()=>{
    const rows = filtered.map(p=>({
      Nama: p.nama,
      Kontak: p.kontak||'-',
      'Jumlah Barang': barang.filter(b=>b.idPenitip===p.id).length,
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Penitip');
    XLSX.writeFile(wb, `Penitip_TitipKu_${new Date().toLocaleDateString('id-ID').replace(/\//g,'-')}.xlsx`);
  };

  const filtered = penitip.filter(p=>
    p.nama.toLowerCase().includes(search.toLowerCase()) ||
    (p.kontak||'').toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div className="fade-up">
      <div className="pg-head" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div><h2>👥 Penitip</h2><p>Kelola mitra penitip barang</p></div>
        <button className="btn btn-blue btn-sm" onClick={openModal} style={{marginTop:2}}>
          <IC.Plus/>Tambah
        </button>
      </div>

      <div className="card">
        {/* Toolbar: search + export */}
        <div className="list-toolbar">
          <div className="search-bar" style={{flex:1,marginBottom:0}}>
            <IC.Search/>
            <input className="search-input" placeholder="Cari nama / kontak…"
              value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          <button className="btn-export" onClick={exportExcel} title="Export Excel">
            <IC.FileXls/>Excel
          </button>
        </div>

        {/* Count */}
        <div style={{fontSize:'.7rem',color:'var(--slate-400)',fontWeight:600,marginBottom:'.6rem'}}>
          {filtered.length} dari {penitip.length} penitip
        </div>

        {loading&&penitip.length===0 ? <SkeletonList/> :
          filtered.length===0 ? (
            <div className="empty">
              <div className="empty-icon">{search?'🔍':'👥'}</div>
              <p>{search?'Tidak ditemukan':'Belum ada penitip'}</p>
              <span>{search?`Coba kata kunci lain`:'Tap "+ Tambah" untuk mulai'}</span>
            </div>
          ) : filtered.map(p=>{
            const jmlBarang = barang.filter(b=>b.idPenitip===p.id).length;
            return (
              <div key={p.id} className="list-row">
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <div style={{
                    width:36,height:36,borderRadius:'50%',flexShrink:0,
                    background:'linear-gradient(135deg,var(--indigo),var(--violet))',
                    display:'flex',alignItems:'center',justifyContent:'center',
                    color:'white',fontWeight:800,fontSize:'.8rem'
                  }}>{p.nama?.[0]?.toUpperCase()}</div>
                  <div>
                    <div style={{fontWeight:600,fontSize:'.875rem'}}>{p.nama}</div>
                    <div style={{fontSize:'.72rem',color:'var(--slate-400)',marginTop:2}}>
                      {p.kontak||'—'} · {jmlBarang} barang
                    </div>
                  </div>
                </div>
                <button className="btn btn-icon btn-red" onClick={()=>hapus(p.id)}><IC.Trash/></button>
              </div>
            );
          })
        }
      </div>

      {/* MODAL TAMBAH PENITIP */}
      {modalOpen&&(
        <>
          <div className="modal-overlay" onClick={closeModal}/>
          <div className="modal-sheet">
            <div className="modal-handle"/>
            <div className="modal-head">
              <h3>Tambah Penitip</h3>
              <button className="modal-close" onClick={closeModal}><IC.X/></button>
            </div>
            <div className="fgrp">
              <label className="flabel">Nama *</label>
              <input className="inp" placeholder="Nama penitip" value={form.nama}
                onChange={e=>setForm({...form,nama:e.target.value})}/>
            </div>
            <div className="fgrp">
              <label className="flabel">No. HP / WA</label>
              <input className="inp" placeholder="08xx…" value={form.kontak}
                onChange={e=>setForm({...form,kontak:e.target.value})}
                onKeyDown={e=>e.key==='Enter'&&tambah()}/>
            </div>
            <button className="btn btn-blue btn-full" style={{marginTop:'.5rem'}} onClick={tambah} disabled={saving}>
              {saving?<><MiniSpin color="white"/>Menyimpan…</>:<><IC.Plus/>Simpan Penitip</>}
            </button>
          </div>
        </>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════
// BARANG
// ══════════════════════════════════════════════════
function PgBarang({penitip,barang,setBarang,notif,loading}){
  const [form,setForm] = React.useState({idPenitip:'',nama:'',stok:'',hargaSetor:'',hargaJual:''});
  const [saving,setSaving] = React.useState(false);
  const [modalOpen,setModalOpen] = React.useState(false);
  const [search,setSearch] = React.useState('');
  const [filterPenitip,setFilterPenitip] = React.useState('');
  const [filterStok,setFilterStok] = React.useState('');

  const openModal = ()=>{ setForm({idPenitip:'',nama:'',stok:'',hargaSetor:'',hargaJual:''}); setModalOpen(true); };
  const closeModal = ()=>setModalOpen(false);

  const tambah = async()=>{
    if(!form.idPenitip||!form.nama||!form.hargaSetor||!form.hargaJual) return notif('Lengkapi semua field','err');
    setSaving(true);
    try{
      const r = await api({action:'addBarang',...form,stok:parseInt(form.stok)||0,hargaSetor:parseInt(form.hargaSetor),hargaJual:parseInt(form.hargaJual)});
      if(r.success){ setBarang(b=>[...b,r.data]); closeModal(); notif('Barang ditambahkan!'); }
      else notif(r.error,'err');
    } catch{ notif('Gagal terhubung','err'); }
    setSaving(false);
  };

  const hapus = async id=>{
    if(!confirm('Hapus barang ini?')) return;
    try{
      const r = await api({action:'deleteBarang',id});
      if(r.success){ setBarang(b=>b.filter(x=>x.id!==id)); notif('Barang dihapus'); }
      else notif(r.error,'err');
    } catch{ notif('Gagal terhubung','err'); }
  };

  const exportExcel = ()=>{
    const rows = filtered.map(b=>{
      const pemilik = penitip.find(p=>p.id===b.idPenitip);
      return {
        'Nama Barang': b.nama,
        Penitip: pemilik?.nama||'-',
        Stok: b.stok,
        'Harga Setor': b.hargaSetor,
        'Harga Jual': b.hargaJual,
        'Margin/pc': b.hargaJual - b.hargaSetor,
      };
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Barang');
    XLSX.writeFile(wb, `Barang_TitipKu_${new Date().toLocaleDateString('id-ID').replace(/\//g,'-')}.xlsx`);
  };

  const filtered = barang.filter(b=>{
    const pemilik = penitip.find(p=>p.id===b.idPenitip);
    const matchSearch = b.nama.toLowerCase().includes(search.toLowerCase()) ||
      (pemilik?.nama||'').toLowerCase().includes(search.toLowerCase());
    const matchPenitip = !filterPenitip || b.idPenitip===filterPenitip;
    const matchStok = !filterStok ||
      (filterStok==='ada' && b.stok>0) ||
      (filterStok==='habis' && b.stok===0) ||
      (filterStok==='menipis' && b.stok>0 && b.stok<=5);
    return matchSearch && matchPenitip && matchStok;
  });

  return (
    <div className="fade-up">
      <div className="pg-head" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div><h2>📦 Barang</h2><p>Kelola barang titipan</p></div>
        <button className="btn btn-blue btn-sm" onClick={openModal} style={{marginTop:2}}>
          <IC.Plus/>Tambah
        </button>
      </div>

      <div className="card">
        {/* Toolbar */}
        <div className="list-toolbar">
          <div className="search-bar" style={{flex:1,marginBottom:0}}>
            <IC.Search/>
            <input className="search-input" placeholder="Cari nama barang / penitip…"
              value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          <button className="btn-export" onClick={exportExcel} title="Export Excel">
            <IC.FileXls/>Excel
          </button>
        </div>

        {/* Filter chips */}
        <div className="filter-chips">
          <button className={`chip ${filterStok===''?'on':''}`} onClick={()=>setFilterStok('')}>Semua</button>
          <button className={`chip ${filterStok==='ada'?'on':''}`} onClick={()=>setFilterStok(filterStok==='ada'?'':'ada')}>Stok Ada</button>
          <button className={`chip ${filterStok==='menipis'?'on':''}`} onClick={()=>setFilterStok(filterStok==='menipis'?'':'menipis')}>Menipis ≤5</button>
          <button className={`chip ${filterStok==='habis'?'on':''}`} onClick={()=>setFilterStok(filterStok==='habis'?'':'habis')}>Habis</button>
          {penitip.map(p=>(
            <button key={p.id} className={`chip ${filterPenitip===p.id?'on':''}`}
              onClick={()=>setFilterPenitip(filterPenitip===p.id?'':p.id)}>
              {p.nama}
            </button>
          ))}
        </div>

        {/* Count */}
        <div style={{fontSize:'.7rem',color:'var(--slate-400)',fontWeight:600,marginBottom:'.6rem'}}>
          {filtered.length} dari {barang.length} barang
        </div>

        {loading&&barang.length===0 ? <SkeletonCard/> :
          filtered.length===0 ? (
            <div className="empty">
              <div className="empty-icon">{search||filterStok||filterPenitip?'🔍':'📦'}</div>
              <p>{search||filterStok||filterPenitip?'Tidak ditemukan':'Belum ada barang'}</p>
              <span>{search||filterStok||filterPenitip?'Coba ubah filter':'Tap "+ Tambah" untuk mulai'}</span>
            </div>
          ) : (
            <div className="barang-grid">
              {filtered.map(b=>{
                const pemilik = penitip.find(p=>p.id===b.idPenitip);
                const margin = b.hargaJual-b.hargaSetor;
                const stokClass = b.stok>5?'badge-green':b.stok>0?'badge-orange':'badge-red';
                return (
                  <div key={b.id} className="barang-card">
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'.45rem'}}>
                      <div style={{flex:1,minWidth:0,paddingRight:4}}>
                        <div style={{fontWeight:700,fontSize:'.78rem',marginBottom:1,lineHeight:1.3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{b.nama}</div>
                        <div style={{fontSize:'.65rem',color:'var(--slate-400)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{pemilik?.nama||'—'}</div>
                      </div>
                      <span className={`badge ${stokClass}`} style={{fontSize:'.6rem',padding:'.15rem .45rem',flexShrink:0}}>{b.stok}</span>
                    </div>
                    <div style={{background:'var(--slate-50)',borderRadius:6,padding:'.4rem .5rem',marginBottom:'.45rem',display:'flex',justifyContent:'space-between'}}>
                      <div>
                        <div style={{fontSize:'.58rem',color:'var(--slate-400)',fontWeight:700}}>SETOR</div>
                        <div style={{fontWeight:600,fontSize:'.72rem'}}>{formatRp(b.hargaSetor)}</div>
                      </div>
                      <div style={{textAlign:'right'}}>
                        <div style={{fontSize:'.58rem',color:'var(--slate-400)',fontWeight:700}}>JUAL</div>
                        <div style={{fontWeight:700,color:'var(--indigo)',fontSize:'.72rem'}}>{formatRp(b.hargaJual)}</div>
                      </div>
                    </div>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <span style={{fontSize:'.65rem',color:'var(--emerald)',fontWeight:700}}>+{formatRp(margin)}</span>
                      <button className="btn btn-icon btn-red" style={{width:26,height:26}} onClick={()=>hapus(b.id)}><IC.Trash/></button>
                    </div>
                  </div>
                );
              })}
            </div>
          )
        }
      </div>

      {/* MODAL TAMBAH BARANG */}
      {modalOpen&&(
        <>
          <div className="modal-overlay" onClick={closeModal}/>
          <div className="modal-sheet">
            <div className="modal-handle"/>
            <div className="modal-head">
              <h3>Tambah Barang</h3>
              <button className="modal-close" onClick={closeModal}><IC.X/></button>
            </div>
            <div className="fgrp">
              <label className="flabel">Penitip *</label>
              <select className="inp" value={form.idPenitip} onChange={e=>setForm({...form,idPenitip:e.target.value})}>
                <option value="">— Pilih Penitip —</option>
                {penitip.map(p=><option key={p.id} value={p.id}>{p.nama}</option>)}
              </select>
            </div>
            <div className="fgrp">
              <label className="flabel">Nama Barang *</label>
              <input className="inp" placeholder="Cth: Nasi Uduk" value={form.nama}
                onChange={e=>setForm({...form,nama:e.target.value})}/>
            </div>
            <div className="frow-3">
              <div className="fgrp">
                <label className="flabel">Stok Awal</label>
                <input className="inp" type="number" min="0" placeholder="0" value={form.stok}
                  onChange={e=>setForm({...form,stok:e.target.value})}/>
              </div>
              <div className="fgrp">
                <label className="flabel">Harga Setor</label>
                <input className="inp" type="number" min="0" placeholder="Rp" value={form.hargaSetor}
                  onChange={e=>setForm({...form,hargaSetor:e.target.value})}/>
              </div>
              <div className="fgrp">
                <label className="flabel">Harga Jual</label>
                <input className="inp" type="number" min="0" placeholder="Rp" value={form.hargaJual}
                  onChange={e=>setForm({...form,hargaJual:e.target.value})}/>
              </div>
            </div>
            <button className="btn btn-blue btn-full" style={{marginTop:'.25rem'}} onClick={tambah} disabled={saving}>
              {saving?<><MiniSpin color="white"/>Menyimpan…</>:<><IC.Plus/>Simpan Barang</>}
            </button>
          </div>
        </>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════
// KASIR
// ══════════════════════════════════════════════════
function PgKasir({barang,penjualan,setBarang,setPenjualan,notif}){
  const [sel,setSel] = React.useState(null);
  const [qty,setQty] = React.useState(1);
  const [saving,setSaving] = React.useState(false);

  const available = barang.filter(b=>b.stok>0);
  const item = barang.find(b=>b.id===sel);

  const simpan = async()=>{
    if(!item||qty<=0) return;
    if(item.stok<qty) return notif(`Stok kurang! Sisa: ${item.stok}`,'err');
    setSaving(true);
    try{
      const stokBaru = item.stok-qty;
      const r = await api({action:'addPenjualan',idBarang:item.id,qty,stokBaru});
      if(r.success){
        setBarang(b=>b.map(x=>x.id===item.id?{...x,stok:stokBaru}:x));
        setPenjualan(p=>[r.data,...p]);
        setSel(null); setQty(1);
        notif(`${item.nama} ×${qty} — berhasil dicatat!`);
      } else notif(r.error,'err');
    } catch{ notif('Gagal terhubung','err'); }
    setSaving(false);
  };

  return (
    <div className="fade-up">
      <div className="pg-head"><h2>🛒 Kasir</h2><p>Catat penjualan barang titipan</p></div>

      <div className="card" style={{marginBottom:'.9rem'}}>
        <div className="card-title">
          <span className="sec-badge" style={{background:'var(--emerald-mid)',color:'var(--emerald)'}}>1</span>
          Pilih Barang
        </div>
        {available.length===0 ? (
          <div className="empty" style={{padding:'1.5rem'}}><div className="empty-icon">📦</div><p>Semua stok habis</p></div>
        ) : (
          <div className="kasir-grid">
            {available.map(b=>(
              <button key={b.id} className={`kasir-tile ${sel===b.id?'sel':''}`}
                onClick={()=>{ setSel(b.id); setQty(1); }}>
                {sel===b.id&&<div style={{position:'absolute',top:6,right:6,width:8,height:8,borderRadius:'50%',background:'var(--emerald)'}}/>}
                <div style={{fontWeight:700,fontSize:'.82rem',marginBottom:4,color:sel===b.id?'#065f46':'var(--slate-800)',lineHeight:1.3}}>{b.nama}</div>
                <div style={{fontWeight:800,color:'var(--emerald)',fontSize:'.88rem'}}>{formatRp(b.hargaJual)}</div>
                <div style={{fontSize:'.62rem',color:'var(--slate-400)',marginTop:3,fontWeight:600}}>STOK: {b.stok}</div>
              </button>
            ))}
          </div>
        )}
      </div>

      {item&&(
        <div className="card pop-in" style={{border:'2px solid var(--emerald)',position:'relative'}}>
          <div style={{
            position:'absolute',top:0,right:0,
            background:'linear-gradient(135deg,var(--emerald),#047857)',
            color:'white',padding:'.22rem .7rem',
            borderRadius:'0 16px 0 10px',
            fontSize:'.63rem',fontWeight:800,letterSpacing:.05
          }}>TERPILIH</div>
          <div className="card-title">
            <span className="sec-badge" style={{background:'var(--emerald-mid)',color:'var(--emerald)'}}>2</span>
            Atur Jumlah &amp; Simpan
          </div>
          <div style={{background:'var(--slate-50)',borderRadius:10,padding:'.85rem',display:'flex',justifyContent:'space-between',marginBottom:'.9rem'}}>
            <div>
              <div style={{fontSize:'.63rem',color:'var(--slate-400)',fontWeight:700,marginBottom:2}}>BARANG</div>
              <div style={{fontWeight:700}}>{item.nama}</div>
            </div>
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:'.63rem',color:'var(--slate-400)',fontWeight:700,marginBottom:2}}>HARGA</div>
              <div style={{fontWeight:700,color:'var(--emerald)'}}>{formatRp(item.hargaJual)}</div>
            </div>
          </div>
          <label className="flabel" style={{marginBottom:'.5rem'}}>Jumlah (maks. {item.stok})</label>
          <div className="qty-wrap" style={{marginBottom:'.9rem'}}>
            <button className="qty-btn" onClick={()=>setQty(q=>Math.max(1,q-1))}>−</button>
            <input className="qty-num" type="number" min="1" max={item.stok} value={qty}
              onChange={e=>{ let v=parseInt(e.target.value)||1; if(v>item.stok) v=item.stok; setQty(v); }}/>
            <button className="qty-btn" onClick={()=>setQty(q=>Math.min(item.stok,q+1))}>+</button>
          </div>
          <hr className="divider"/>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.9rem'}}>
            <span style={{fontWeight:600,color:'var(--slate-600)'}}>Total Bayar</span>
            <span style={{fontWeight:800,fontSize:'1.35rem',color:'var(--emerald)',letterSpacing:'-.02em'}}>{formatRp(item.hargaJual*qty)}</span>
          </div>
          <button className="btn btn-green btn-full" onClick={simpan} disabled={saving}>
            {saving?<><MiniSpin color="white"/>Menyimpan…</>:<><IC.Check/>Simpan Penjualan</>}
          </button>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════
// SETORAN
// ══════════════════════════════════════════════════
function PgSetoran({penitip,barang,penjualan,loading}){
  const hitungSetoran = id => penjualan.reduce((t,p)=>{
    const b=barang.find(x=>x.id===p.idBarang);
    return t+(b&&b.idPenitip===id?b.hargaSetor*p.qty:0);
  },0);

  const aktif = penitip.filter(p=>hitungSetoran(p.id)>0);

  return (
    <div className="fade-up">
      <div className="pg-head"><h2>💰 Setoran</h2><p>Tagihan yang harus dibayarkan ke penitip</p></div>

      {loading&&aktif.length===0 ? (
        <div className="card">
          {[1,2].map(i=><div key={i} className="skeleton skel-block" style={{marginBottom:'.65rem'}}/>)}
        </div>
      ) : aktif.length===0 ? (
        <div className="card"><div className="empty"><div className="empty-icon">💰</div><p>Belum ada tagihan</p><span>Catat penjualan di Kasir agar laporan ini terisi</span></div></div>
      ) : aktif.map(p=>{
        const total = hitungSetoran(p.id);
        const detail = penjualan.filter(j=>{ const b=barang.find(x=>x.id===j.idBarang); return b&&b.idPenitip===p.id; });
        const sum = {};
        detail.forEach(j=>{ const b=barang.find(x=>x.id===j.idBarang); if(!b) return; if(!sum[b.id]) sum[b.id]={nama:b.nama,qty:0,hs:b.hargaSetor}; sum[b.id].qty+=j.qty; });
        return (
          <div key={p.id} className="setor-card">
            <div className="setor-head">
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <div style={{
                  width:36,height:36,borderRadius:'50%',flexShrink:0,
                  background:'linear-gradient(135deg,var(--indigo),var(--violet))',
                  display:'flex',alignItems:'center',justifyContent:'center',
                  color:'white',fontWeight:800,fontSize:'.8rem'
                }}>{p.nama?.[0]?.toUpperCase()}</div>
                <div>
                  <div style={{fontWeight:700,color:'var(--slate-800)'}}>{p.nama}</div>
                  <div style={{fontSize:'.72rem',color:'var(--slate-400)',marginTop:2}}>{p.kontak||'—'}</div>
                </div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:'.6rem',color:'var(--slate-400)',fontWeight:700,marginBottom:3}}>WAJIB SETOR</div>
                <div style={{fontWeight:800,fontSize:'1.15rem',color:'var(--indigo)'}}>{formatRp(total)}</div>
              </div>
            </div>
            <div className="setor-body">
              <div style={{fontSize:'.63rem',color:'var(--slate-400)',fontWeight:700,textTransform:'uppercase',marginBottom:8,letterSpacing:'.06em'}}>Rincian</div>
              {Object.values(sum).map((x,i)=>(
                <div key={i} className="setor-row">
                  <span style={{color:'var(--slate-600)'}}>{x.nama} <span style={{color:'var(--slate-300)'}}>×{x.qty}</span></span>
                  <span style={{fontWeight:700,color:'var(--slate-700)'}}>{formatRp(x.qty*x.hs)}</span>
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── RENDER ──────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

// ── SERVICE WORKER (PWA offline support) ────────────────────────
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    const sw = `
self.addEventListener('install',e=>{ self.skipWaiting(); });
self.addEventListener('activate',e=>{ e.waitUntil(clients.claim()); });
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET') return;
  if(e.request.url.includes('googleapis') || e.request.url.includes('cdnjs') || e.request.url.includes('script.google')) return;
  e.respondWith(
    caches.open('titipku-v1').then(c=>
      c.match(e.request).then(r=>r||fetch(e.request).then(res=>{ c.put(e.request,res.clone()); return res; }))
    )
  );
});`;
    const blob = new Blob([sw],{type:'application/javascript'});
    const url = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).catch(()=>{});
  });
}
</script>
